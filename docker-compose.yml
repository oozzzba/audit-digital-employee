# 审计数字员工 · 单机部署编排
# 用法：在 code/ 目录下执行 `docker compose up -d --build`
#   - .env（含 DEEPSEEK_API_KEY）由 env_file 在运行时注入，不进入镜像
#   - SQLite 数据库落到命名卷 audit_data，容器重建/升级不丢项目状态
services:
  audit-app:
    build: .
    container_name: audit-digital-employee
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AUDIT_DB_PATH=/data/audit.db
    volumes:
      - audit_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  audit_data:
